name: docker-build
run-name: Docker build ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version embedded in the image (e.g. v0.3.16); defaults to dev"
        required: false
        default: dev
        type: string

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build the image from source
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          # The docker exporter cannot retain OCI attestations in the classic
          # image store, and this run does not publish a manifest.
          provenance: false
          sbom: false
          tags: artex:ci-${{ matrix.arch }}
          build-args: |
            ARTEX_BINARY_SOURCE=source
            ARTEX_BUILD_VERSION=${{ env.VERSION }}
            NPM_REGISTRY=https://registry.npmjs.org
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha,scope=artex-source-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=artex-source-${{ matrix.arch }}
      - name: Run database, API, UI, browser and shutdown checks
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          python3 scripts/smoke-docker.py "artex:ci-$ARCH" "$version" --platform "linux/$ARCH"
